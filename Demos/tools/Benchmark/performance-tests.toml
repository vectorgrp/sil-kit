[repositories.reference]
version = "v5.0.7"

[repositories.under_test]
version = "main"


[[tests]]
name = "latency"
unit = "us"
topic = "Latency"
csv_output = "latency.csv"
# lower latency is the improvement, so the regression threshold is the upper one
higher_is_better = false

[tests.kpis]
mean = { label = "latency(us)" }
err = { label = "latency_err" }

[[tests.demos]]
executable = "SilKitDemoLatency"
args = [
    "--isReceiver",
    "--message-size", "10",
    "--message-count", "1000000",
]

[[tests.demos]]
executable = "SilKitDemoLatency"
# args are treated as a Python format string (see str.format) with the following bindings available:
# - test.*: any field of the current test
# - repository.*: any field of the repository the test is being executed from
# - run.csv_output: {repository.results_dir} joined with {test.csv_output}
args = [
    "--write-csv", "{run.csv_output}",
    "--message-size", "10",
    "--message-count", "1000000",
]


[[tests]]
name = "throughput-large-msg"
unit = "MiB/s"
topic = "Throughput (large messages)"
csv_output = "throughput-large-msg.csv"

[tests.kpis]
mean = { label = "throughput(MiB/s)" }
err = { label = "throughput_err" }

[[tests.demos]]
executable = "SilKitDemoBenchmark"
args = [
    "--write-csv", "{run.csv_output}",
    "--message-size", "100000",
    "--message-count", "10",
    "--simulation-duration", "10",
    "--number-simulation-runs", "50",
]


[[tests]]
name = "throughput-small-msg"
unit = "MiB/s"
topic = "Throughput (small messages)"
csv_output = "throughput-small-msg.csv"

[tests.kpis]
mean = { label = "throughput(MiB/s)" }
err = { label = "throughput_err" }

[[tests.demos]]
executable = "SilKitDemoBenchmark"
args = [
    "--write-csv", "{run.csv_output}",
    "--message-size", "10",
    "--message-count", "100",
    "--simulation-duration", "10",
    "--number-simulation-runs", "50",
]


# NB: the tests above all run with the default of two participants, i.e. a fan-out of one, so they
#     cannot observe the cost of sending a single message to many peers. The following two do.
#
#     Deliveries scale with participants*(participants-1), so moving from 2 to 8 participants
#     multiplies them by 28 and the wall clock with them. Shorten the simulation duration to pay
#     for that, and do NOT lower the message count: the message count sets the load per simulation
#     step, and the run has to stay saturated (reported speedup below 1) for the KPI to measure
#     capacity rather than the virtual time step pacing. An unsaturated run is insensitive to the
#     very costs these tests exist to detect.
#
#     Measured on one machine, one run, 8 participants, 16 byte messages:
#       message-count 200, duration 10 -> 120s, speedup 0.084, 936k msg/s
#       message-count  50, duration  2 ->   6s, speedup 0.333, 933k msg/s   (kept)
#       message-count  10, duration 10 ->   8s, speedup 1.26,  704k msg/s   (unsaturated, rejected)
#     and with 65536 byte messages:
#       message-count   4, duration 10 ->  19s, speedup 0.516, 7.22e3 MiB/s
#       message-count   4, duration  2 ->   3s, speedup 0.664, 9.29e3 MiB/s (kept)
#       message-count   2, duration  5 ->   5s, speedup 1.14,  7.99e3 MiB/s (unsaturated, rejected)
[[tests]]
name = "throughput-fanout-large-msg"
unit = "MiB/s"
topic = "Throughput (large messages, fan-out of 8)"
csv_output = "throughput-fanout-large-msg.csv"

[tests.kpis]
mean = { label = "throughput(MiB/s)" }
err = { label = "throughput_err" }

[[tests.demos]]
executable = "SilKitDemoBenchmark"
args = [
    "--write-csv", "{run.csv_output}",
    "--message-size", "65536",
    "--message-count", "4",
    "--simulation-duration", "2",
    "--number-participants", "8",
    "--number-simulation-runs", "20",
]


[[tests]]
name = "throughput-fanout-small-msg"
unit = "1/s"
topic = "Message rate (small messages, fan-out of 8)"
csv_output = "throughput-fanout-small-msg.csv"

[tests.kpis]
mean = { label = "messageRate(1/s)" }
err = { label = "messageRate_err" }

[[tests.demos]]
executable = "SilKitDemoBenchmark"
args = [
    "--write-csv", "{run.csv_output}",
    "--message-size", "16",
    "--message-count", "50",
    "--simulation-duration", "2",
    "--number-participants", "8",
    "--number-simulation-runs", "20",
]
