name: 'Linux Release Builds'
on:
  workflow_call:
    inputs:
      run_build:
        required: true
        type: boolean

jobs:
  ubuntu-release:
    strategy:
      matrix:
        toolchain:
          - cc: clang-18
            cxx: clang++-18
          - cc: gcc
            cxx: g++
    name: ${{ matrix.toolchain.cc }} release Builds for Ubuntu

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vectorgrp/sil-kit-docker-build/sil-kit-ci-public-runner:main
    if: (inputs.run_build == true) || (github.event_name == 'push')
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: ./.github/actions/build-cmake-preset
        id: build
        with:
          preset-name: release
          cmake-args: "-DCMAKE_C_COMPILER=${{ matrix.toolchain.cc }} \
                       -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }}"
          artifact-label: "${{ github.job }}-${{ matrix.toolchain.cc }}"
      - name: Integration tests against the package
        run: |
          mkdir -p _pkg
          cmake -E chdir _pkg cmake -E tar xf "$PWD/${{ steps.build.outputs.package-path }}"
          silkit_dir=$(dirname "$(find "$PWD/_pkg" -name SilKitConfig.cmake | head -n 1)")
          cmake -S SilKit/IntegrationTests -B _build/itests-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.toolchain.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.toolchain.cxx }} \
            -DSILKIT_WARNINGS_AS_ERRORS=ON \
            -DSILKIT_DIR="$silkit_dir"
          cmake --build _build/itests-package
          ctest --test-dir _build/itests-package --output-on-failure -L 'unit|integration'
        shell: bash
