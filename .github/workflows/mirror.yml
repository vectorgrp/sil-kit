name: Mirror Main to Private Repo

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch: 

jobs:
  mirror:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: vector-actions/repo-sync-action@main
        with:
          app-key:          ${{ secrets.VECTOR_APP_KEY }}
          app-id:           ${{ secrets.VECTOR_APP_ID }}
          remote-repo-url:  ${{ secrets.SIL_KIT_PRIVATE_REPO_URL }}
          remote-branch:    ${{ secrets.SIL_KIT_PRIVATE_MIRROR_TO_BRANCH }}
          local-branch:     origin/main
