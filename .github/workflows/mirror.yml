name: Mirror Main to Private Repo

# This workflow uses vector-actions/repo-sync-action, which only exists on the
# internal GitHub Enterprise instance. It therefore runs on an internal runner
# and pushes outwards to the private GitHub.com repo, mirroring RepoSync.yaml.

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror main branch to the private GitHub.com repo
    runs-on: Linux
    environment: SyncRemoteRepoEnv

    steps:
      - uses: actions/checkout@v3
        with:
          clean: true
          fetch-depth: 0

      - uses: vector-actions/repo-sync-action@main
        with:
          app-key:          ${{ secrets.VECTOR_APP_KEY }}
          app-id:           ${{ secrets.VECTOR_APP_ID }}
          remote-repo-url:  ${{ secrets.SIL_KIT_PRIVATE_REPO_URL }}
          remote-branch:    ${{ secrets.SIL_KIT_PRIVATE_MIRROR_TO_BRANCH }}
          local-branch:     origin/main
